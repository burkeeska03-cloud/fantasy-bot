AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Scheduled ESPN Fantasy Football to GroupMe bot

Parameters:
  SsmParameterName:
    Type: String
    Description: Name of the SecureString SSM parameter holding the JSON configuration.
  ScheduleExpression:
    Type: String
    Default: rate(1 hour)
    Description: EventBridge schedule expression; rate(1 hour) posts every hour.

Resources:
  FantasyBot:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: fantasy_bot.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 30
      Environment:
        Variables:
          SSM_PARAMETER_NAME: !Ref SsmParameterName
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref SsmParameterName
      Events:
        HourlyUpdate:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Name: fantasy-groupme-hourly
            Description: Posts the current ESPN fantasy matchup report to GroupMe.
            Enabled: true

Outputs:
  FunctionName:
    Description: Lambda function name
    Value: !Ref FantasyBot
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt FantasyBot.Arn
